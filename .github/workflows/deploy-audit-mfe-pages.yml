name: Deploy prototypes to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'prototypes/**'
      - '.github/workflows/deploy-audit-mfe-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Schema Renderer
        working-directory: prototypes/schema-renderer
        run: |
          npm ci
          npm run build -- --base-href /guideline-java/schema-renderer/
      - name: Build Workspace MFE
        working-directory: prototypes/workspace-mfe
        run: |
          npm install --no-audit --no-fund
          npm run build -- --base-href /guideline-java/workspace-mfe/
      - name: Assemble Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp prototypes/index.html _site/index.html
          for name in audit-events audit-mfe tse; do
            cp -a "prototypes/$name" "_site/$name"
          done
          mkdir -p _site/schema-renderer _site/workspace-mfe
          cp -a prototypes/schema-renderer/dist/schema-renderer-poc/browser/. _site/schema-renderer/
          cp -a prototypes/workspace-mfe/dist/workspace-mfe/browser/. _site/workspace-mfe/
          cp _site/schema-renderer/index.html _site/schema-renderer/404.html
          cp _site/workspace-mfe/index.html _site/workspace-mfe/404.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
