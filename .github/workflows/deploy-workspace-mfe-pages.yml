name: Deploy Workspace MFE to GitHub Pages

on:
  push:
    branches:
      - feat/workspace-mfe-prototype
    paths:
      - 'workspace-mfe/**'
      - 'prototypes/audit-mfe/**'
      - '.github/workflows/deploy-workspace-mfe-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: workspace-mfe
        run: npm install --no-audit --no-fund
      - name: Build Angular for project Pages URL
        working-directory: workspace-mfe
        run: npm run build -- --base-href /guideline-java/
      - name: Include Audit MFE conceptual prototype
        run: |
          mkdir -p workspace-mfe/dist/workspace-mfe/browser/prototypes/audit-mfe
          cp prototypes/audit-mfe/index.html workspace-mfe/dist/workspace-mfe/browser/prototypes/audit-mfe/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: workspace-mfe/dist/workspace-mfe/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
