name: Schema Studio - GitHub Pages
on:
  push:
    branches: [feature/poc-schema-renderer]
    paths:
      - 'poc/schema-renderer/**'
      - '.github/workflows/schema-renderer-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: schema-studio-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: poc/schema-renderer
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: Test
        working-directory: poc/schema-renderer
        run: npm test
      - name: Build for GitHub Pages
        working-directory: poc/schema-renderer
        run: npm run build -- --base-href /guideline-java/
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -a poc/schema-renderer/dist/schema-renderer-poc/browser/. _site/
          cp _site/index.html _site/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
