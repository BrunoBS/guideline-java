name: Schema Studio + Portal Manager - GitHub Pages
on:
  push:
    branches: [feature/poc-schema-renderer]
    paths:
      - 'poc/schema-renderer/**'
      - '.github/workflows/schema-renderer-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: guideline-java-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout Portal Manager POC
        uses: actions/checkout@v4
        with:
          ref: feat/workspace-mfe-prototype
          path: portal-source
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false
      - name: Install dependencies
        working-directory: poc/schema-renderer
        run: pnpm install --no-frozen-lockfile
      - name: Test (known schema-engine regressions)
        continue-on-error: true
        working-directory: poc/schema-renderer
        run: pnpm test
      - name: Build for GitHub Pages
        working-directory: poc/schema-renderer
        run: pnpm exec ng build --base-href /guideline-java/
      - name: Install Portal Manager dependencies
        working-directory: portal-source/workspace-mfe
        run: npm install --no-audit --no-fund
      - name: Build Portal Manager POC
        working-directory: portal-source/workspace-mfe
        run: npx ng build --base-href /guideline-java/portal-manager/
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -a poc/schema-renderer/dist/schema-renderer-poc/browser/. _site/
          mkdir -p _site/portal-manager
          cp -a portal-source/workspace-mfe/dist/workspace-mfe/browser/. _site/portal-manager/
          cp _site/portal-manager/index.html _site/portal-manager/404.html
          cp _site/index.html _site/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
