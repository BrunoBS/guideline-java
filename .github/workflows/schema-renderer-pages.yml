name: Schema Studio + Portal Manager - GitHub Pages
on:
  push:
    branches: [feature/poc-schema-renderer]
    paths:
      - 'poc/schema-renderer/**'
      - 'tse/**'
      - '.github/workflows/schema-renderer-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: guideline-java-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Schema Studio
        uses: actions/checkout@v4
        with:
          ref: feature/poc-schema-renderer
      - name: Checkout Portal Manager POC
        uses: actions/checkout@v4
        with:
          ref: feat/workspace-mfe-prototype
          path: portal-source
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Schema Studio dependencies (lockfile)
        working-directory: poc/schema-renderer
        run: npm ci
      - name: Install browsers for Schema Studio checks
        if: ${{ github.event_name == 'workflow_dispatch' || contains(toJSON(github.event.commits), 'poc/schema-renderer/') }}
        working-directory: poc/schema-renderer
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Check Schema Studio before publishing
        if: ${{ github.event_name == 'workflow_dispatch' || contains(toJSON(github.event.commits), 'poc/schema-renderer/') }}
        working-directory: poc/schema-renderer
        run: npm run check:all
      - name: Build for GitHub Pages
        working-directory: poc/schema-renderer
        run: npm run build -- --base-href /guideline-java/
      # Portal Manager uses Angular 22 with TypeScript 6.0.x; publish the latest Workspace navigation POC.
      # Refresh Pages with onboarding UI from feat/workspace-mfe-prototype (f45639e6).
      - name: Install Portal Manager dependencies
        working-directory: portal-source/workspace-mfe
        run: npm install --no-audit --no-fund
      - name: Build Portal Manager POC
        working-directory: portal-source/workspace-mfe
        run: npx ng build --base-href /guideline-java/portal-manager/
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -a poc/schema-renderer/dist/schema-renderer-poc/browser/. _site/
          mkdir -p _site/portal-manager
          cp -a portal-source/workspace-mfe/dist/workspace-mfe/browser/. _site/portal-manager/
          cp _site/portal-manager/index.html _site/portal-manager/404.html
          cp _site/index.html _site/404.html
      - name: Publish TSE dashboard
        run: |
          mkdir -p _site/tse
          cp -a tse/. _site/tse/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
