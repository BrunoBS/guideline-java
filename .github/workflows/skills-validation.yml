name: Skills validation (isolated)
on:
  push:
    branches: [docs/golden-engineering-skills]
    paths:
      - 'Skills/laboratorio-java/**'
      - 'Skills/laboratorio-integracao/**'
      - 'Skills/laboratorio-spring-hibernate/**'
      - '.github/workflows/skills-validation.yml'
  pull_request:
    paths:
      - 'Skills/laboratorio-java/**'
      - 'Skills/laboratorio-integracao/**'
      - '.github/workflows/skills-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java25-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Show Java version
        run: java -version && javac -version
      - name: Compile and run smoke tests
        working-directory: Skills/laboratorio-java
        run: |
          mkdir -p out
          javac --release 25 -d out src/*.java
          java -cp out SmokeTests
  mysql-redis-testcontainers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: Skills/laboratorio-integracao/pom.xml
      - name: Verify Docker availability
        run: docker version
      - name: Run MySQL and Redis integration tests
        working-directory: Skills/laboratorio-integracao
        run: mvn -B -ntp verify
      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skills-mysql-redis-surefire
          path: Skills/laboratorio-integracao/target/surefire-reports/
          if-no-files-found: warn

  spring-hibernate-testcontainers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: Skills/laboratorio-spring-hibernate/pom.xml
      - name: Verify Docker
        run: docker version
      - name: Verify Spring Boot 4 + Hibernate + MySQL
        working-directory: Skills/laboratorio-spring-hibernate
        run: mvn -B -ntp verify
      - name: Archive Spring Hibernate test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skills-spring-hibernate-surefire
          path: Skills/laboratorio-spring-hibernate/target/surefire-reports/
          if-no-files-found: warn
