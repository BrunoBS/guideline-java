<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden • Protótipo Audit MFE</title><style>:root{font-family:Inter,system-ui,Arial;color:#17233a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#101d36;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}header small{color:#aabbd6}main{max-width:1100px;margin:35px auto;padding:0 18px}.panel{background:white;border:1px solid #e0e5ef;border-radius:14px;padding:24px;margin:18px 0;box-shadow:0 4px 16px #101d3608}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.tile{border:1px solid #cdd8ea;border-radius:12px;padding:22px;cursor:pointer;background:#fafcff;text-align:left}.tile:hover{border-color:#3d6bb6}button{cursor:pointer;background:#2057a4;color:white;border:0;border-radius:8px;padding:10px 15px;margin:5px 5px 5px 0}button.secondary{background:#eaf0f9;color:#234267}input,select{padding:10px;border:1px solid #cdd8ea;border-radius:8px;max-width:100%;margin:5px}.muted{color:#64748b}.tag{font-size:12px;background:#edf3fd;color:#22559d;padding:4px 8px;border-radius:20px}.event{border-left:3px solid #3e6fc0;margin-left:12px;padding:0 0 25px 22px;position:relative}.event:before{content:"";width:11px;height:11px;background:#3e6fc0;border-radius:50%;position:absolute;left:-7px;top:4px}h1{font-size:26px}h2{font-size:20px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #e5eaf2;text-align:left}@media(max-width:650px){table{font-size:12px}.panel{padding:15px}}</style></head><body><header><div><strong>GOLDEN PLATFORM</strong> <small> / Audit MFE · Protótipo</small></div><button class="secondary" onclick="home()">Início</button></header><main><div id="app"></div></main><script>
const events=[{id:'evt-104',date:'11/11/2026 09:42',type:'Publicação em DEV',actor:'ana.silva',env:'DEV',op:null,snapshot:true,resource:'CHAVE_PAGAMENTO'},{id:'evt-103',date:'10/11/2026 16:10',type:'Promoção para DEV',actor:'bruno',env:'DEV',op:'op-701',snapshot:true,resource:'CHAVE_PAGAMENTO'},{id:'evt-102',date:'10/11/2026 14:15',type:'Alteração de chave',actor:'bruno',env:'DEV',op:null,snapshot:true,resource:'CHAVE_PAGAMENTO'},{id:'evt-201',date:'10/11/2026 17:02',type:'Promoção para HOM',actor:'bruno',env:'HOM',op:'op-701',snapshot:true,resource:'CHAVE_PAGAMENTO'},{id:'evt-202',date:'10/11/2026 17:24',type:'Promoção para PROD',actor:'bruno',env:'PROD',op:'op-701',snapshot:true,resource:'CHAVE_PAGAMENTO'},{id:'evt-203',date:'10/11/2026 17:28',type:'Publicação de toggle',actor:'bruno',env:'PROD',op:'op-701',snapshot:false,resource:'TOGGLE_CHECKOUT'}];
const operations=[{id:'op-701',type:'PROMOTION',status:'SUCCESS',date:'10/11/2026 17:28',gmud:'GMUD-2026-42',pkg:'PKG-901',actor:'bruno'},{id:'op-699',type:'ROLLBACK',status:'SUCCESS',date:'08/11/2026 11:30',gmud:'GMUD-2026-40',pkg:'PKG-887',actor:'maria'}];
let origin='feature',screen='home',backScreen='timeline',selected='';const app=document.getElementById('app');
function layout(title,subtitle,body){app.innerHTML='<h1>'+title+'</h1><p class="muted">'+subtitle+'</p>'+body}
function home(){screen='home';layout('Protótipo · MFE de Auditoria','Selecione um fluxo para simular o contrato de entrada do micro frontend.','<div class="grid"><button class="tile" onclick="feature()"><h2>Fluxo Feature</h2><p>Chaves, Toggles, Menus e outras features.</p><span class="tag">Timeline → Evento / Operação</span></button><button class="tile" onclick="motor()"><h2>Fluxo Motor de Promoção</h2><p>Busca de recursos e operações.</p><span class="tag">Pesquisa → Operação → Evento</span></button></div><p class="muted">Dados simulados. Nenhuma consulta ou download real é realizado.</p>')}
function feature(){origin='feature';timeline()}
function motor(){origin='motor';search('resource')}
function nav(){return '<button class="secondary" onclick="'+(origin==='motor'?"search('operations')":"timeline()")+'">← Voltar</button>'}
function timeline(){screen='timeline';layout('Timeline de eventos','Contexto recebido por input data · Workspace: WS-DEMO · Aplicação: APP-PAGAMENTOS · Ambiente: DEV · Tipo: CHAVE · Recurso: CHAVE_PAGAMENTO','<div class="panel">'+events.filter(e=>e.env==='DEV'&&e.resource==='CHAVE_PAGAMENTO').map(e=>'<div class="event"><span class="tag">'+e.env+'</span> <strong>'+e.type+'</strong><p class="muted">'+e.date+' · '+e.actor+'</p><button class="secondary" onclick="detail(\''+e.id+'\',\'timeline\')">Detalhes do evento</button>'+(e.op?'<button onclick="operation(\''+e.op+'\')">Ver operação '+e.op+'</button>':'')+'</div>').join('')+'</div>')}
function detail(id,from){selected=id;backScreen=from;const e=events.find(x=>x.id===id);layout('Detalhe do evento',id, '<div class="panel">'+(from==='operation'?'<button class="secondary" onclick="operation(\''+e.op+'\')">← Voltar à operação</button>':nav())+'<h2>'+e.type+'</h2><table>'+[['Identificador',e.id],['Workspace','WS-DEMO'],['Aplicação','APP-PAGAMENTOS'],['Ambiente',e.env],['Recurso',e.resource],['Executor',e.actor],['Data e hora',e.date],['Operação',e.op||'Não vinculada']].map(x=>'<tr><th>'+x[0]+'</th><td>'+x[1]+'</td></tr>').join('')+'</table>'+(e.snapshot?'<button onclick="alert(\'Protótipo: download de snapshot indisponível sem integração com o Audit Service.\')">Baixar snapshot</button>':'<p class="muted">Snapshot não disponível.</p>')+'</div>')}
function search(tab){screen='search';layout('Motor de Promoção · Auditoria','Workspace WS-DEMO (fixo) · Pesquisa de recursos e operações','<div class="panel"><button class="'+(tab==='resource'?'':'secondary')+'" onclick="search(\'resource\')">Buscar Recursos</button><button class="'+(tab==='operations'?'':'secondary')+'" onclick="search(\'operations\')">Buscar Operações</button><hr>'+(tab==='resource'?'<div class="toolbar"><label>Aplicação <input value="APP-PAGAMENTOS"></label><label>Tipo <select><option>CHAVE</option><option>TOGGLE</option></select></label><label>Nome <input value="Chave Pagamento"></label></div><table><tr><th>Recurso</th><th>Identificador</th><th>Ação</th></tr><tr><td>Chave Pagamento</td><td>CHAVE_PAGAMENTO</td><td><button onclick="search(\'operations\')">Pesquisar operações</button></td></tr></table>':'<div class="toolbar"><label>Período <select><option>30 dias</option><option>10 dias</option><option>60 dias</option><option>90 dias</option></select></label><label>UUID recurso <input placeholder="Opcional" value="CHAVE_PAGAMENTO"></label><label>Aplicação <input placeholder="Opcional"></label><label>GMUD <input placeholder="Opcional"></label></div><table><tr><th>Operação</th><th>Tipo</th><th>Status</th><th>Data</th><th></th></tr>'+operations.map(o=>'<tr><td>'+o.id+'</td><td>'+o.type+'</td><td>'+o.status+'</td><td>'+o.date+'</td><td><button onclick="operation(\''+o.id+'\')">Detalhes</button></td></tr>').join('')+'</table>')+'</div>')}
function operation(id){screen='operation';selected=id;const o=operations.find(x=>x.id===id);layout('Detalhe da operação',id,'<div class="panel">'+nav()+'<div class="grid"><p><strong>Tipo:</strong> '+o.type+'</p><p><strong>Status:</strong> '+o.status+'</p><p><strong>GMUD:</strong> '+o.gmud+'</p><p><strong>Pacote:</strong> '+o.pkg+'</p><p><strong>Executor:</strong> '+o.actor+'</p></div><button onclick="csv(\''+id+'\')">Exportar CSV de eventos</button></div><div class="panel"><h2>Eventos vinculados · todos os ambientes</h2>'+events.filter(e=>e.op===id).map(e=>'<div class="event"><span class="tag">'+e.env+'</span> <strong>'+e.type+'</strong><p class="muted">'+e.date+' · '+e.resource+'</p><button class="secondary" onclick="detail(\''+e.id+'\',\'operation\')">Detalhe do evento</button></div>').join('')+'</div>')}
function csv(id){const rows=[['event_id','date','type','environment','resource','actor','operation_id'],...events.filter(e=>e.op===id).map(e=>[e.id,e.date,e.type,e.env,e.resource,e.actor,e.op])];const blob=new Blob(['\ufeff'+rows.map(r=>r.join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='eventos-'+id+'.csv';a.click();URL.revokeObjectURL(a.href)}home();
</script></body></html>
