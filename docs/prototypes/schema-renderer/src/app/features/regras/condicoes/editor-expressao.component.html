<div
  class="expression-editor"
  role="group"
  [attr.aria-label]="grupo ? 'Lista de condições' : 'Comparação do campo'"
>
  <p *ngIf="!guiada">Expressão avançada preservada. Edite em Para Dev.</p>
  <ng-container *ngIf="guiada">
    <ng-container *ngIf="grupo as chave; else folha">
      <div class="condition-toolbar">
        <label class="group-operator"
          >Atender
          <select
            aria-label="Atender"
            [ngModel]="grupo"
            (ngModelChange)="trocarOperadorDoGrupo($event)"
          >
            <option value="allOf">Todas as condições (E)</option>
            <option value="anyOf">Pelo menos uma condição (OU)</option>
          </select>
        </label>
        <button type="button" (click)="adicionarFilho(chave)">+ Adicionar condição</button>
      </div>
      <p class="match-help">
        {{
          grupo === 'allOf'
            ? 'Todas as condições abaixo precisam ser verdadeiras.'
            : 'Basta uma das condições abaixo ser verdadeira.'
        }}
      </p>
      <div
        class="expression-child"
        *ngFor="let filho of schema[chave]; index as i; trackBy: identificarFilho"
      >
        <button
          type="button"
          class="remove-condition"
          (click)="removerFilho(chave, i)"
          [disabled]="schema[chave].length <= 1"
          [attr.aria-label]="'Excluir condição ' + (i + 1)"
          title="Excluir condição"
        >
          Excluir
        </button>
        <span
          class="condition-connector"
          [attr.aria-label]="i === 0 ? 'Primeira condição' : grupo === 'allOf' ? 'E' : 'OU'"
          >{{ i === 0 ? 'SE' : grupo === 'allOf' ? 'E' : 'OU' }}</span
        >
        <app-editor-expressao
          [schema]="filho"
          [objeto]="objeto"
          [raiz]="raiz"
          (alteracao)="alterarFilho(chave, i, $event)"
        ></app-editor-expressao>
      </div>
    </ng-container>
    <ng-template #folha>
      <div class="expression-comparison">
        <div class="expression-fields">
          <label
            >Campo<select [ngModel]="caminho" (ngModelChange)="definirCampo($event)">
              <option value="" disabled>Selecione</option>
              <option *ngFor="let campo of campos" [value]="campo.caminho">
                {{ campo.schema.title || campo.segmentos.join(' › ') }}
              </option>
            </select></label
          >
          <label
            >Operador<select [(ngModel)]="operador">
              <option value="equals">É igual a</option>
              <option value="different">É diferente de</option>
              <option value="present">Está presente</option>
              <option value="absent">Está ausente</option>
              <option *ngFor="let opcao of operadores" [value]="opcao.valor">
                {{ opcao.rotulo }}
              </option>
            </select></label
          >
          <app-valor-condicao
            *ngIf="!['present', 'absent'].includes(operador)"
            [definicao]="definicao"
            [tipo]="tipoAtivo"
            [texto]="valor"
            [valor]="valorAtual"
            (textoAlterado)="definirTexto($event)"
            (rascunhoAlterado)="definirTexto($event)"
            (valorAlterado)="definirValor($event)"
            (tipoAlterado)="definirTipo($event)"
          ></app-valor-condicao>
        </div>
      </div>
    </ng-template>
  </ng-container>
  <p role="alert" class="builder-error" *ngIf="erro">{{ erro }}</p>
</div>
